name: Stripe Production Guard

# Catches silent drift between what production's checkout actually does and what
# this repo believes it does. That belief has been wrong twice: the checklist
# said "NOT LIVE YET" for ten days while real cards were being charged, then
# said "LIVE AND TAKING REAL MONEY" after production had been rolled back to
# test keys and the store had quietly stopped collecting anything.
#
# It creates a Stripe Checkout Session, which moves no money and charges nobody,
# and it sends one event to the webhook.
#
# THAT EVENT MUST BE SIGNED, and this is why the job now takes a secret. An
# UNSIGNED post answers 400, and a 400 proves nothing: a verifier that works and
# a verifier that rejects every event look identical from outside. sts.py is
# honest about that and reports webhook_ok=false whenever it cannot prove the
# case either way, so without the secret this check can never pass. It never
# did. The guard ran red every day from 2026-07-28 to 2026-08-01 on exactly
# that, and a permanently red alarm is one nobody reads.
#
# STRIPE_WEBHOOK_SECRET fixes it by letting the probe sign the event the way
# Stripe does. What it sends is a payment_intent.created carrying a fake id, and
# the handler subscribes only to checkout.session.completed and
# checkout.session.async_payment_succeeded, so a verified probe event is parsed
# and then ignored. It proves the verifier without fulfilling an order, emailing
# anyone, or writing a row.

on:
  schedule:
    # Daily at 14:00 UTC (7am PT / 10am ET) - an hour after the signals sweep.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The mode production is SUPPOSED to be in. This is the whole point of the
  # guard: an accidental cutover and an accidental rollback both show up as a
  # mismatch against this line.
  #
  # Cutover completed 2026-08-01. Evidence, rather than an assertion: charge
  # ch_3TzowQCYoTMkQm811AnxPHY5 for $5.00 captured against a real card, session
  # cs_live_a1d3bc... complete/paid, and fulfilled_sessions carrying that
  # session_id with status=delivered, attempts=1, last_error=null. Advertised
  # $5.00 equals charged $5.00, so there is no price drift to hide behind.
  #
  # From here a mismatch means production drifted OFF live, which is the silent
  # failure that cost ten days last time: the storefront still renders, still
  # takes a card, and collects nothing.
  EXPECTED_MODE: live

jobs:
  probe:
    name: Probe production checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # sts.py already fails on price drift (advertised != charged). It does NOT
      # fail on a mode change, because it has no way to know which mode you
      # meant - that is what EXPECTED_MODE supplies.
      - name: Probe and assert
        env:
          # Must be the LIVE endpoint secret, the whsec_... belonging to the
          # production-fulfillment destination (we_1TzoPYCYoTMkQm81E4almkKI).
          # A test-mode secret signs an event production correctly rejects, and
          # the guard would then report a broken verifier that is in fact fine.
          #
          # Absent, the job still runs and still catches mode drift and price
          # drift. It just cannot prove the webhook, and says so.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -o pipefail
          python scripts/sts.py stripe --live --json | tee probe.json || true
          python - <<'PY'
          import json, os, sys

          # The probe is piped through `|| true` so a drift exit code doesn't kill
          # the step before we can report every problem at once. That also means a
          # crashed or network-failed probe leaves probe.json empty, which must
          # read as "could not verify", not as a pass.
          try:
              st = json.load(open('probe.json'))
          except Exception as exc:
              print(f':: FAIL - the probe produced no usable JSON ({exc}).')
              print('   Production state is UNVERIFIED. Check whether the site is up.')
              sys.exit(1)

          expected = os.environ['EXPECTED_MODE']
          failures = []

          mode = st.get('mode')
          if mode != expected:
              if expected == 'live':
                  failures.append(
                      f"Production is in {mode!r} mode but should be {expected!r}. "
                      "The storefront is NOT collecting money - a real card is "
                      "declined on a test-mode Stripe page.")
              else:
                  failures.append(
                      f"Production is in {mode!r} mode but this repo expects "
                      f"{expected!r}. If the cutover was intentional, flip "
                      "EXPECTED_MODE in this workflow. If it was not, real cards "
                      "are being charged right now.")

          if not st.get('webhook_ok'):
              failures.append(
                  f"Webhook is not configured (HTTP {st.get('webhook_status')}). "
                  "Paid orders are lost whenever the buyer's browser doesn't reach "
                  "the success page.")

          # Price drift - sts.py's own check, surfaced here so one job reports
          # every problem at once instead of one per run.
          for e in st.get('errors', []):
              failures.append(e)

          adv = ', '.join(f"${c/100:.2f}" for c in st.get('advertised_cents') or []) or 'none found'
          charged = st.get('charged_cents')
          print(f"mode={mode} expected={expected} webhook_ok={st.get('webhook_ok')}")
          print(f"advertised={adv} charged={'$%.2f' % (charged/100) if charged is not None else 'not verified'}")

          if failures:
              print('\n:: FAIL')
              for f in failures:
                  print(f'  - {f}')
              print('\nSee STRIPE-GO-LIVE.md. These are environment/dashboard faults;'
                    ' do not "fix" them by editing application code.')
              sys.exit(1)

          print('\n:: OK - production matches what this repo expects.')
          PY
