<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="Panic To Paperwork In Eighteen Days">
<rect x="1" y="1" width="898" height="518" rx="12" fill="#020617" stroke="#1e293b" stroke-width="2"/>
<text x="40" y="46" font-size="19" letter-spacing="2" fill="#f1f5f9">PANIC TO PAPERWORK IN EIGHTEEN DAYS</text>
<line x1="40" y1="60" x2="467" y2="60" stroke="#f59e0b" stroke-width="2"/>
<text x="40" y="82" font-size="12.5" fill="#94a3b8">June 12 to June 30, 2026: Stage 2 and Stage 3 of this chapter, run at speed.</text>
<rect x="146.1" y="120" width="462.6" height="16" rx="4" fill="#d97706" fill-opacity="0.85"/>
<text x="154.1" y="132" font-size="11" fill="#020617" font-weight="600">STAGE 2: THE PANIC AND THE PLUG</text>
<rect x="608.7" y="120" width="165.2" height="16" rx="4" fill="#3b82f6" fill-opacity="0.9"/>
<text x="614.7" y="132" font-size="11" fill="#f1f5f9" font-weight="600">STAGE 3</text>
<line x1="80" y1="250" x2="840" y2="250" stroke="#475569" stroke-width="2"/>
<text x="245.2" y="272" font-size="10.5" fill="#94a3b8" text-anchor="middle">Jun 15</text>
<text x="476.5" y="272" font-size="10.5" fill="#94a3b8" text-anchor="middle">Jun 22</text>
<text x="707.8" y="272" font-size="10.5" fill="#94a3b8" text-anchor="middle">Jun 29</text>
<circle cx="146.1" cy="250" r="7" fill="#d97706" stroke="#020617" stroke-width="2"/>
<line x1="146.1" y1="222" x2="146.1" y2="241" stroke="#475569" stroke-width="1"/>
<text x="152.1" y="158" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">JUNE 12</text>
<text x="152.1" y="174" font-size="11.5" fill="#94a3b8" text-anchor="start">Commerce requires a license</text>
<text x="152.1" y="189" font-size="11.5" fill="#94a3b8" text-anchor="start">for two frontier models;</text>
<text x="152.1" y="204" font-size="11.5" fill="#94a3b8" text-anchor="start">the lab switches them off</text>
<text x="152.1" y="219" font-size="11.5" fill="#94a3b8" text-anchor="start">worldwide</text>
<circle cx="608.7" cy="250" r="7" fill="#3b82f6" stroke="#020617" stroke-width="2"/>
<line x1="608.7" y1="259" x2="608.7" y2="282" stroke="#475569" stroke-width="1"/>
<text x="602.7" y="294" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="end">JUNE 26</text>
<text x="602.7" y="310" font-size="11.5" fill="#94a3b8" text-anchor="end">Trusted partners exempted</text>
<text x="602.7" y="325" font-size="11.5" fill="#94a3b8" text-anchor="end">for critical infrastructure</text>
<circle cx="740.9" cy="250" r="7" fill="#3b82f6" stroke="#020617" stroke-width="2"/>
<line x1="740.9" y1="207" x2="740.9" y2="241" stroke="#475569" stroke-width="1"/>
<text x="734.9" y="158" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="end">JUNE 30</text>
<text x="734.9" y="174" font-size="11.5" fill="#94a3b8" text-anchor="end">Controls lifted, on</text>
<text x="734.9" y="189" font-size="11.5" fill="#94a3b8" text-anchor="end">conditions: detect risks,</text>
<text x="734.9" y="204" font-size="11.5" fill="#94a3b8" text-anchor="end">report misuse, set standards</text>
<circle cx="773.9" cy="250" r="7" fill="#3b82f6" stroke="#020617" stroke-width="2"/>
<line x1="773.9" y1="259" x2="773.9" y2="342" stroke="#475569" stroke-width="1"/>
<text x="767.9" y="354" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="end">JULY 1</text>
<text x="767.9" y="370" font-size="11.5" fill="#94a3b8" text-anchor="end">Access begins returning</text>
<text x="80" y="450" font-size="11.5" fill="#94a3b8">Within days of the order, a Chinese lab published an open-weight model under an MIT license:</text>
<text x="80" y="466" font-size="11.5" fill="#94a3b8">"no regional limits, technical access without borders."</text>
<text x="40" y="498" font-size="10.5" fill="#94a3b8">Sources: Mayer Brown (June 30, 2026); Al Jazeera (July 1, 2026); Z.ai GLM-5.2 model card. Details in the chapter.</text>
</svg>
