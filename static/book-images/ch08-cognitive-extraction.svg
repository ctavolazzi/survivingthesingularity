<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 542" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">WHEN ATTENTION GETS DIVERTED</title>
<desc id="desc">A conceptual sequence follows time for a chosen task, a switch to another item, unfinished work, and possible time spent reorienting. A side branch shows an alert drawing attention away. Some switches help; no brain chemistry or fixed time cost is claimed.</desc>
<rect x="0" y="0" width="480" height="542" fill="#0f172a" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#f1f5f9" text-anchor="start" font-weight="600">WHEN ATTENTION GETS DIVERTED</text>
<path d="M20 48L460 48" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">A possible pattern to notice in your day.</text>
<path d="M59 111L59 448" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<circle cx="59" cy="120" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
<text x="86" y="125" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600">THE TASK YOU CHOSE</text>
<text x="86" y="151" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Time and attention available.</text>
<circle cx="59" cy="223" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="86" y="228" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600">A SWITCH TO SOMETHING ELSE</text>
<text x="86" y="254" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Some switches help; others interrupt.</text>
<circle cx="59" cy="329" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
<text x="86" y="334" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600">WORK LEFT WAITING</text>
<text x="86" y="360" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Returning can require reorientation.</text>
<circle cx="59" cy="431" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
<text x="86" y="436" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="600">LESS TIME ON THE TASK</text>
<text x="86" y="462" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">A possible cost, not a diagnosis.</text>
<path d="M59 173H403V205" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M398 198L403 205L408 198" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="butt" />
<text x="87" y="195" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="400">An alert or a feed pulls you away.</text>
<path d="M20 487L460 487" fill="none" stroke="#526176" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="507" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Conceptual illustration, not brain chemistry.</text>
</svg>
