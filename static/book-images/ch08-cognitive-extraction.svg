<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="638" rx="12" fill="#020617" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#94a3b8">THE COGNITIVE EXTRACTION ENGINE</text>
  <line x1="40" y1="66" x2="428" y2="66" stroke="#1e293b" stroke-width="2"/>

  <!-- Stage 1 -->
  <rect x="220" y="92" width="420" height="78" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="126" font-size="18" font-weight="600" fill="#f59e0b" text-anchor="middle">YOUR AVAILABLE ATTENTION</text>
  <text x="430" y="150" font-size="13" fill="#94a3b8" text-anchor="middle">time for the task you chose</text>

  <line x1="430" y1="170" x2="430" y2="224" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="450" y="202" font-size="13" fill="#94a3b8">scrolling and alerts compete for it</text>

  <!-- Stage 2 -->
  <rect x="220" y="232" width="420" height="78" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="430" y="266" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">REPEATED TASK SWITCHES</text>
  <text x="430" y="290" font-size="13" fill="#94a3b8" text-anchor="middle">work pauses for another item</text>

  <line x1="430" y1="310" x2="430" y2="364" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="450" y="342" font-size="13" fill="#94a3b8">some switches help; others interrupt</text>

  <!-- Stage 3 -->
  <rect x="220" y="372" width="420" height="78" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="430" y="406" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">WORK LEFT WAITING</text>
  <text x="430" y="430" font-size="13" fill="#94a3b8" text-anchor="middle">returning can require reorientation</text>

  <line x1="430" y1="450" x2="430" y2="504" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="450" y="482" font-size="13" fill="#94a3b8">notice the cost in your own day</text>

  <!-- Stage 4 -->
  <rect x="220" y="512" width="420" height="78" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="430" y="546" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle">LESS TIME ON YOUR TASK</text>
  <text x="430" y="570" font-size="13" fill="#64748b" text-anchor="middle">a possible pattern, not a diagnosis</text>
  <text x="430" y="618" font-size="12" fill="#94a3b8" text-anchor="middle">conceptual illustration, not a model of brain chemistry</text>
</svg>
