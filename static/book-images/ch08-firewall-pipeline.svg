<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 585" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">THE COGNITIVE FIREWALL</title>
<desc id="desc">A suggested routine moves from incoming messages, through scheduled checks and paper notes, to a chosen task. A clock, ledger and workbench distinguish steps. Twice-daily checks are an example schedule rather than an experimentally measured optimum.</desc>
<rect x="0" y="0" width="480" height="585" fill="#0f172a" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#f1f5f9" text-anchor="start" font-weight="600">THE COGNITIVE FIREWALL</text>
<path d="M20 48L460 48" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">A routine you can try, observe and adjust.</text>
<text x="112" y="128" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="600">INCOMING</text>
<text x="112" y="154" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Messages, feeds and alerts.</text>
<text x="112" y="239" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="600">SCHEDULE CHECKS</text>
<text x="112" y="265" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Try two timed windows each day.</text>
<text x="112" y="286" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Adjust to the work and people involved.</text>
<text x="112" y="353" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="600">MAKE NOTES</text>
<text x="112" y="379" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Put useful findings in a paper ledger.</text>
<text x="112" y="400" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Keep what the chosen task needs.</text>
<text x="112" y="465" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="600">DO THE WORK</text>
<text x="112" y="491" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Welds, beds, charters:</text>
<text x="112" y="512" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">return to a task you chose.</text>
