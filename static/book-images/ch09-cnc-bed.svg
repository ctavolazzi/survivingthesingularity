<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">TOOLS OVER A GROWING BED</title>
<desc id="desc">Top-view concept of a growing bed with horizontal X travel, a gantry with Y travel across it, and a Z tool moving toward a plant. Generic tools seed, water or weed. Reduced walking space does not remove human inspection, maintenance and harvest, and this is not a model-specific build plan.</desc>
