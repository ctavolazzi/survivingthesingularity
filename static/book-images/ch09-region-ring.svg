<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="THE REGION, NOT THE CITY LIMITS">
<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#f59e0b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3b82f6"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ef4444"/></marker></defs>
<rect x="1" y="1" width="478" height="608" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
<text x="24" y="34" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="600">THE REGION, NOT THE CITY LIMITS</text>
<line x1="24" y1="46" x2="456" y2="46" stroke="#f59e0b" stroke-width="1.5"/>
<text x="24" y="69" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">A dense core cannot produce everything.</text>
<text x="24" y="88" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">The productive region around it can.</text>
<rect x="24" y="115" width="207" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="127.5" y="141" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">FOOD PRODUCTION</text>
<text x="127.5" y="168" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">CSA farms, greenhouses,</text>
<text x="127.5" y="186" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">grow towers</text>
<rect x="249" y="115" width="207" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="352.5" y="141" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">MATERIALS RECOVERY</text>
<text x="352.5" y="168" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">Recover scrap and</text>
<text x="352.5" y="186" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">reusable materials</text>
<path d="M127 225 V252 H194 V270" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
<path d="M353 225 V252 H286 V270" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
<rect x="114" y="276" width="252" height="90" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="240.0" y="302" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">DENSE CITY CORE</text>
<text x="240.0" y="329" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">High density,</text>
<text x="240.0" y="347" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">low production</text>
<text x="407" y="266" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="400">SUPPLY IN</text>
<path d="M127 409 V389 H194 V372" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
<path d="M353 409 V389 H286 V372" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
<rect x="24" y="415" width="207" height="112" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="127.5" y="441" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">ENERGY + WATER</text>
<text x="127.5" y="468" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">Solar, storage,</text>
<text x="127.5" y="486" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">microgrids</text>
<rect x="249" y="415" width="207" height="112" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="352.5" y="441" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">NEIGHBORHOOD</text>
<text x="352.5" y="461" font-size="14" fill="#f1f5f9" text-anchor="middle" font-weight="600">FACTORIES</text>
<text x="352.5" y="488" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">Plasma tables,</text>
<text x="352.5" y="506" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">printers, fab labs</text>
<text x="24" y="555" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">The ring builds capacity and local work.</text>
<text x="24" y="574" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">If the trucks stop, the region still eats.</text>
<text x="24" y="593" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">Resilience, not secession.</text>
</svg>
