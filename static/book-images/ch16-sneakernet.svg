<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 424" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">A library walks across town</title>
<desc id="desc">A checked file moves between two computers on hand-carried storage. No live network link is required. Private material may be encrypted, but loss, copying, incompatible software and unsafe endpoints remain possible.</desc>
