<text x="130.5" y="554" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">BCS-type / GVCS</text>
<text x="130.5" y="572" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">pattern</text>
