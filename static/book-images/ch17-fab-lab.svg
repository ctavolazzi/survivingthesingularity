<text x="24" y="618" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">Fabricate the replacement instead of waiting.</text>
<text x="24" y="637" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">Pattern library: Global Village Construction</text>
<text x="24" y="656" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="400">Set, fifty machines for a small civilization.</text>
