<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 562" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">A neighborhood fab lab</title>
<desc id="desc">A printer, a metalworking station and a shared walk-behind tractor are tools for selected jobs. Suitable materials, trained people, maintenance and checking remain necessary. Commercial tractor forms are not labelled open source, and parts are not guaranteed fit for every application.</desc>
