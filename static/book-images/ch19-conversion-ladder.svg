<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="The Ladder">
<rect x="1" y="1" width="898" height="648" rx="12" fill="#020617" stroke="#1e293b" stroke-width="2"/>
<text x="40" y="46" font-size="19" letter-spacing="2" fill="#f1f5f9">THE LADDER</text>
<line x1="40" y1="60" x2="162" y2="60" stroke="#f59e0b" stroke-width="2"/>
<text x="40" y="82" font-size="12.5" fill="#94a3b8">Nine rungs, from the bottom up. Start with food. Climb as far as your town can hold.</text>
<rect x="40" y="424" width="6" height="148" rx="3" fill="#f59e0b"/>
<text x="58" y="502" font-size="11" letter-spacing="1" fill="#94a3b8">FEED PEOPLE NOW</text>
<rect x="40" y="268" width="6" height="148" rx="3" fill="#f59e0b"/>
<text x="58" y="346" font-size="11" letter-spacing="1" fill="#94a3b8">CHANGE WHO OWNS AND DECIDES</text>
<rect x="40" y="112" width="6" height="148" rx="3" fill="#f59e0b"/>
<text x="58" y="190" font-size="11" letter-spacing="1" fill="#94a3b8">WIDEN THE FLOOR</text>
<rect x="300" y="528" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="554" font-size="16" font-weight="600" fill="#f1f5f9">1</text>
<text x="352" y="545" font-size="13" font-weight="600" fill="#f1f5f9">Count what&#x27;s wasted and who&#x27;s hungry</text>
<text x="352" y="561" font-size="11" fill="#94a3b8">California SB 1383 recovery targets</text>
<rect x="300" y="476" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="502" font-size="16" font-weight="600" fill="#f1f5f9">2</text>
<text x="352" y="493" font-size="13" font-weight="600" fill="#f1f5f9">Feed everyone who asks</text>
<text x="352" y="509" font-size="11" fill="#94a3b8">France, 2016: no destroying edible food</text>
<rect x="300" y="424" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="450" font-size="16" font-weight="600" fill="#f1f5f9">3</text>
<text x="352" y="441" font-size="13" font-weight="600" fill="#f1f5f9">Make the meal a public service</text>
<text x="352" y="457" font-size="11" fill="#94a3b8">California universal school meals, 2022</text>
<rect x="300" y="372" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="398" font-size="16" font-weight="600" fill="#f1f5f9">4</text>
<text x="352" y="389" font-size="13" font-weight="600" fill="#f1f5f9">Take the ground off the market</text>
<text x="352" y="405" font-size="11" fill="#94a3b8">community land trusts, 99-year leases</text>
<rect x="300" y="320" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="346" font-size="16" font-weight="600" fill="#f1f5f9">5</text>
<text x="352" y="337" font-size="13" font-weight="600" fill="#f1f5f9">Own the machines together</text>
<text x="352" y="353" font-size="11" fill="#94a3b8">rural electric co-ops, from 1936</text>
<rect x="300" y="268" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="294" font-size="16" font-weight="600" fill="#f1f5f9">6</text>
<text x="352" y="285" font-size="13" font-weight="600" fill="#f1f5f9">Stop letting a score decide who survives</text>
<text x="352" y="301" font-size="11" fill="#94a3b8">NYC right to counsel, 2017</text>
<rect x="300" y="216" width="560" height="40" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="322" y="242" font-size="16" font-weight="600" fill="#f1f5f9">7</text>
<text x="352" y="233" font-size="13" font-weight="600" fill="#f1f5f9">Widen the floor</text>
<text x="352" y="249" font-size="11" fill="#94a3b8">NHS, 1948; Universal Basic Services</text>
<rect x="300" y="164" width="560" height="40" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-dasharray="7 4" stroke-width="2"/>
<text x="322" y="190" font-size="16" font-weight="600" fill="#f1f5f9">8</text>
<text x="352" y="181" font-size="13" font-weight="600" fill="#f1f5f9">Put it on the scoreboard, in public</text>
<text x="352" y="197" font-size="11" fill="#94a3b8">holds the ladder together</text>
<rect x="300" y="112" width="560" height="40" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-dasharray="7 4" stroke-width="2"/>
<text x="322" y="138" font-size="16" font-weight="600" fill="#f1f5f9">9</text>
<text x="352" y="129" font-size="13" font-weight="600" fill="#f1f5f9">Keep the market above the floor</text>
<text x="352" y="145" font-size="11" fill="#94a3b8">money stays; it becomes optional</text>
<rect x="300" y="588" width="18" height="12" rx="3" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
<text x="326" y="599" font-size="11" fill="#94a3b8">already done somewhere</text>
<rect x="560" y="588" width="18" height="12" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>
<text x="586" y="599" font-size="11" fill="#94a3b8">how you hold it together</text>
<text x="40" y="628" font-size="10.5" fill="#94a3b8">Chapter 19. Sources for every rung in the chapter and in Appendix B.</text>
</svg>
