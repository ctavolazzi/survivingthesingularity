<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="When The Jobs Go, Dinner Goes">
