<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">NINE STAGES OF THE SINGULARITY</title>
<desc id="desc">Nine speculative stages grouped into AGI, ASI, and later imagined possibilities. The fourth stage, a new social contract, is emphasized as a choice. The diagram assigns no guaranteed arrival date; stages may overlap, stall, or fail to occur.</desc>
<rect x="0" y="0" width="480" height="640" fill="#0f172a" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#f1f5f9" text-anchor="start" font-weight="600">NINE STAGES OF THE SINGULARITY</text>
<path d="M20 48L460 48" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">A speculative map, not a timetable.</text>
<text x="20" y="111" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="600">THE ERA OF AGI · STAGES 1–5</text>
<path d="M40 150L40 158" fill="none" stroke="#526176" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M40 184L40 192" fill="none" stroke="#526176" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M40 218L40 226" fill="none" stroke="#526176" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M40 252L40 278" fill="none" stroke="#526176" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<circle cx="40" cy="137" r="13" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
<text x="40" y="142" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="600">1</text>
<text x="68" y="142" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Cash Grab</text>
<circle cx="40" cy="171" r="13" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
<text x="40" y="176" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="600">2</text>
<text x="68" y="176" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Panic and the Plug</text>
<circle cx="40" cy="205" r="13" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
<text x="40" y="210" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="600">3</text>
<text x="68" y="210" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Adults Step In</text>
<circle cx="40" cy="239" r="13" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="40" y="244" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">4</text>
<text x="68" y="244" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="600">The New Social Contract</text>
<text x="68" y="264" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="600">&amp; the End of Labor</text>
<circle cx="40" cy="291" r="13" fill="#0f172a" stroke="#f1f5f9" stroke-width="2"/>
<text x="40" y="296" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="600">5</text>
<text x="68" y="296" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Primate Backlash</text>
<text x="20" y="336" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="600">THE LEAP TO ASI · STAGES 6–7</text>
<text x="40" y="365" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="400">6</text>
<text x="68" y="365" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The ASI Exodus</text>
<text x="40" y="399" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="400">7</text>
<text x="68" y="399" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">Simulation, Transhumanism,</text>
<text x="68" y="419" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">the Ultimate Cure</text>
<text x="20" y="461" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="600">SPECULATIVE APEX · STAGES 8–9</text>
<text x="40" y="490" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="400">8</text>
<text x="68" y="490" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Transition to USI</text>
<text x="40" y="524" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="400">9</text>
<text x="68" y="524" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="400">The Apex Intelligence</text>
<path d="M20 558L460 558" fill="none" stroke="#526176" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="578" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Stages may overlap, stall or not occur.</text>
<text x="20" y="599" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Stage 4 is the choice this book argues for.</text>
<text x="20" y="620" font-size="14" fill="#a6b4c8" text-anchor="start" font-weight="400">Later stages are imagined possibilities.</text>
</svg>
