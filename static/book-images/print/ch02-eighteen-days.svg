<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 636" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">PANIC TO PAPERWORK</title>
<desc id="desc">Selected events in June and July 2026. On June 12 US export controls took effect and Anthropic suspended Fable 5 and Mythos 5 worldwide. June 26 approval allowed Mythos access for a set of US organizations. Export controls were lifted June 30. Fable access returned globally July 1 while Mythos access stayed limited. Event spacing is not proportional to elapsed time.</desc>
<rect x="0" y="0" width="480" height="636" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">PANIC TO PAPERWORK</text>
<path d="M20 48L460 48" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Eighteen days: June 12 to June 30, 2026.</text>
<text x="20" y="99" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Fable 5 and Mythos 5; different access.</text>
<path d="M40 132L40 448" fill="none" stroke="#a2afa6" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<circle cx="40" cy="130" r="7" fill="#9a4f13" stroke="#9a4f13" stroke-width="2"/>
<text x="67" y="135" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">JUNE 12</text>
<text x="67" y="160" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">US export controls take effect.</text>
<text x="67" y="181" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Anthropic suspends both models</text>
<text x="67" y="202" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">for all users worldwide.</text>
<circle cx="40" cy="239" r="7" fill="#ffffff" stroke="#315f78" stroke-width="2"/>
<text x="67" y="244" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">JUNE 26</text>
<text x="67" y="269" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Government approval permits Mythos</text>
<text x="67" y="290" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">access for a set of US organizations.</text>
<circle cx="40" cy="331" r="7" fill="#ffffff" stroke="#315f78" stroke-width="2"/>
<text x="67" y="336" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">JUNE 30</text>
<text x="67" y="361" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Export controls are lifted.</text>
<text x="67" y="382" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Anthropic outlines new safeguards</text>
<text x="67" y="403" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">and government collaboration.</text>
<circle cx="40" cy="441" r="7" fill="#ffffff" stroke="#315f78" stroke-width="2"/>
<text x="67" y="446" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">JULY 1</text>
<text x="67" y="471" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Fable access returns globally.</text>
<text x="67" y="492" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Mythos access remains limited</text>
<text x="67" y="513" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">to approved organizations.</text>
<path d="M20 533L460 533" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="553" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Selected events; spacing is not elapsed time.</text>
<text x="20" y="574" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Source: Anthropic, Redeploying Fable 5,</text>
<text x="20" y="595" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">June 30, updated July 1, 2026.</text>
<text x="20" y="616" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Stage 2 / Stage 3 is the author’s reading.</text>
</svg>
