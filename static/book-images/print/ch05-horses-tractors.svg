<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">THE HERD AND THE MACHINE</title>
<desc id="desc">Two line charts of US farm counts on January 1, 1910 through 1949. Horses and mules peaked at 26.723 million in 1918 and fell to 8.274 million in 1949. Tractors increased from 1,000 in 1910 to 3.5 million in 1949. The charts use different vertical scales. 1948 and 1949 data are preliminary in USDA Statistical Bulletin 83, table 14.</desc>
