<text x="20" y="32" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">THE HERD AND THE MACHINE</text>
<path d="M20 48L460 48" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">On US farms, January 1, 1910–1949.</text>
<text x="20" y="105" font-size="15" fill="#17251f" text-anchor="start" font-weight="600">HORSES AND MULES · MILLIONS</text>
<text x="20" y="132" font-size="14" fill="#9a4f13" text-anchor="start" font-weight="400">1918 peak: 26.7 million</text>
