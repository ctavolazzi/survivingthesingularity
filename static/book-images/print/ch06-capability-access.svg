<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">THE GAP IS WHERE WE DECIDE</title>
<desc id="desc">Four distinct questions: whether a machine can do a task, whether it is deployed, who controls it, and whether someone can access the result without money. A vertical rail links four different symbols; no answer guarantees the next.</desc>
<rect x="0" y="0" width="480" height="548" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">THE GAP IS WHERE WE DECIDE</text>
<path d="M20 48L460 48" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Four questions. Each needs its own answer.</text>
<path d="M56 114L56 423" fill="none" stroke="#a2afa6" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<circle cx="56" cy="139" r="22" fill="#ffffff" stroke="#9a4f13" stroke-width="2"/>
<path d="M44 139H68M56 127V151" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<circle cx="56" cy="139" r="7" fill="#ffffff" stroke="#9a4f13" stroke-width="1"/>
<text x="99" y="126" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">CAPABILITY</text>
<text x="99" y="152" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Can a machine</text>
<text x="99" y="173" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">do the task?</text>
<circle cx="56" cy="230" r="22" fill="#ffffff" stroke="#9a4f13" stroke-width="2"/>
<path d="M45 231L53 239L68 222" fill="none" stroke="#9a4f13" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="butt" />
<text x="99" y="217" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">DEPLOYMENT</text>
<text x="99" y="243" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Is it working</text>
<text x="99" y="264" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">somewhere real?</text>
<circle cx="56" cy="321" r="22" fill="#ffffff" stroke="#9a4f13" stroke-width="2"/>
<circle cx="50" cy="320" r="5" fill="#ffffff" stroke="#9a4f13" stroke-width="1.5"/>
<path d="M55 320H69V327M63 320V325" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="99" y="308" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">OWNERSHIP</text>
<text x="99" y="334" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Who controls it</text>
<text x="99" y="355" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">and sets the terms?</text>
<circle cx="56" cy="412" r="22" fill="#ffffff" stroke="#315f78" stroke-width="2"/>
<circle cx="56" cy="412" r="13" fill="#ffffff" stroke="#315f78" stroke-width="1"/>
<text x="99" y="399" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">ACCESS</text>
<text x="99" y="425" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Can a person get the result</text>
<text x="99" y="446" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">without money?</text>
<path d="M20 473L460 473" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="493" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">A productive farm can stand beside hunger.</text>
<text x="20" y="514" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">The terms of access are a decision.</text>
</svg>
