<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 457" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">INTERRUPTED WORK</title>
<desc id="desc">An illustrative attention curve rises, drops after three interruptions, and resumes unevenly. A dashed line is a sustained-focus reference. Neither line represents measured data or establishes a recovery time, causal effect size, or interruption threshold.</desc>
<rect x="0" y="0" width="480" height="457" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">INTERRUPTED WORK</text>
