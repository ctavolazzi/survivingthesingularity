<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 20.9 786.4 501" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#64748b"/>
    </marker>
    <marker id="aai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#d97706"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE COGNITIVE FRAGMENTATION CURVE</text>
  <line x1="40" y1="66" x2="440" y2="66" stroke="#cbd5e1" stroke-width="2"/>

  
  <line x1="100" y1="110" x2="100" y2="430" stroke="#64748b" stroke-width="2" marker-start="url(#ax)"/>
  <line x1="100" y1="430" x2="800" y2="430" stroke="#64748b" stroke-width="2" marker-end="url(#ax)"/>
  <text x="66" y="270" font-size="16.8" fill="#334155" text-anchor="middle" transform="rotate(-90 66 270)">cognitive depth</text>
  <text x="450" y="466" font-size="16.8" fill="#334155" text-anchor="middle">time (one hour)</text>

  
  <line x1="100" y1="150" x2="800" y2="150" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <text x="792" y="140" font-size="15" fill="#1d4ed8" text-anchor="end">deep focus baseline</text>

  
  <path d="M 100 424            C 150 400 180 170 240 152            L 320 151            L 326 400            C 380 380 420 240 470 210            L 476 402            C 520 386 560 300 610 268            L 616 404            C 660 390 700 330 760 312" fill="none" stroke="#d97706" stroke-width="3"/>

  
  <g stroke="#0f172a" stroke-width="1.5" opacity="0.85">
    <line x1="323" y1="120" x2="323" y2="404"/>
    <line x1="473" y1="120" x2="473" y2="404"/>
    <line x1="613" y1="120" x2="613" y2="404"/>
  </g>
  
  <g fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round">
    <polyline points="327,99 320,107 326,107 319,116"/>
    <polyline points="477,99 470,107 476,107 469,116"/>
    <polyline points="617,99 610,107 616,107 609,116"/>
  </g>
  <text x="470" y="94" font-size="16.8" fill="#334155" text-anchor="middle">algorithmic interrupts (3+ per hour)</text>

  
  <line x1="252" y1="206" x2="240" y2="166" stroke="#d97706" stroke-width="1.5" marker-end="url(#aai)"/>
  <text x="230" y="224" font-size="12" fill="#b45309">settling in:</text>
  <text x="230" y="242" font-size="12" fill="#b45309">~20 minutes</text>

  
  <line x1="712" y1="252" x2="688" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="714" y="226" font-size="16.8" fill="#334155" text-anchor="middle">each recovery</text>
  <text x="714" y="244" font-size="16.8" fill="#334155" text-anchor="middle">peaks lower</text>

  <text x="430" y="506" font-size="18.2" fill="#0f172a" text-anchor="middle">above ~3 interrupts per hour, the curve never touches baseline again</text>
</svg>
