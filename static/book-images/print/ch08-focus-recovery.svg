<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Attention on task · illustrative, not data</text>
<text x="272" y="111" font-size="14" fill="#4b5b52" text-anchor="middle" font-weight="400">Interruptions</text>
<path d="M58 145V326H449" fill="none" stroke="#a2afa6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M443 321L449 326L443 331" fill="none" stroke="#a2afa6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M58 168L443 168" fill="none" stroke="#315f78" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="7 5" />
<path d="M191 142L191 315" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="3 5" />
<path d="M195 121L187 130H194L187 139" fill="none" stroke="#17251f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M286 142L286 315" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="3 5" />
<path d="M290 121L282 130H289L282 139" fill="none" stroke="#17251f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M367 142L367 315" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="3 5" />
<path d="M371 121L363 130H370L363 139" fill="none" stroke="#17251f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="butt" />
<path d="M58 318C80 303 101 186 132 171L188 170L194 310C216 292 242 223 283 200L289 309C314 294 343 248 364 231L370 313C395 296 416 280 441 269" fill="none" stroke="#9a4f13" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="butt" />
<text x="253" y="355" font-size="14" fill="#4b5b52" text-anchor="middle" font-weight="400">Time · not to scale</text>
<path d="M23 385L52 385" fill="none" stroke="#315f78" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="7 5" />
<text x="64" y="390" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Sustained focus reference</text>
<text x="20" y="422" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">No fixed recovery time or threshold.</text>
<text x="20" y="443" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Returning to unfinished work varies.</text>
</svg>
