<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 607" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">TWO WAYS TO TAKE IN INFORMATION</title>
<desc id="desc">Two illustrative routines contrast responding to each alert with chosen check times. Broken task segments show interruptions; two message-check windows surround a protected task period. No quantitative time scale, neurological measurement, or guaranteed cognitive benefit is implied.</desc>
<rect x="0" y="0" width="480" height="607" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="32" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">TWO WAYS TO TAKE IN INFORMATION</text>
<path d="M20 48L460 48" fill="none" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Routines, not measurements of your brain.</text>
<text x="20" y="117" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">RESPOND TO EACH ALERT</text>
<text x="20" y="145" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Work pauses when another item arrives.</text>
