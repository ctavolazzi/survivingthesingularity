<text x="20" y="277" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Task interrupted; returning takes attention.</text>
<path d="M20 307L460 307" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="344" font-size="16" fill="#17251f" text-anchor="start" font-weight="600">CHOOSE WHEN TO CHECK</text>
<text x="20" y="372" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Batch messages; keep notes you can use.</text>
<rect x="31" y="398" width="86" height="59" fill="#edf0ec" stroke="#a2afa6" stroke-width="1"/>
<rect x="360" y="398" width="87" height="59" fill="#edf0ec" stroke="#a2afa6" stroke-width="1"/>
