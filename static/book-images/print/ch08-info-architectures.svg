<text x="404" y="433" font-size="14" fill="#4b5b52" text-anchor="middle" font-weight="400">Check</text>
<rect x="129" y="408" width="219" height="39" fill="#ffffff" stroke="#315f78" stroke-width="2"/>
<text x="238" y="433" font-size="15" fill="#17251f" text-anchor="middle" font-weight="400">Chosen task</text>
<text x="20" y="489" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">A schedule can protect time for that task.</text>
<path d="M20 520L460 520" fill="none" stroke="#a2afa6" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" />
<text x="20" y="540" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Some interruptions are useful or urgent.</text>
<text x="20" y="561" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Try a routine; check whether it helps.</text>
<text x="20" y="582" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">No guaranteed cognitive effect is implied.</text>
