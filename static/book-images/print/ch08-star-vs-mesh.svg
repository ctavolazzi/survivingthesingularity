<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 616" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">TRUST NETWORK TOPOLOGIES</title>
<desc id="desc">A star graph loses its hub and the spokes connected to it. A mesh with a failed central node retains a route around the outside. Failure is shown with crosses, affected links with dashes, and surviving links with solid strokes, so the distinction does not depend on color. Actual resilience requires a working path and maintained relationships.</desc>
