<text x="20" y="550" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">A mesh can reroute if a usable path remains.</text>
<text x="20" y="571" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">People maintain the circle and its links.</text>
<text x="20" y="592" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Cross: failed node. Dashes: affected links.</text>
