<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 20.9 788.2 490.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#d97706"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE CNC AUTONOMOUS BED</text>
  <text x="40" y="74" font-size="16.8" fill="#475569">FarmBot-style gantry over a dense coordinate-planted bed</text>
  <line x1="40" y1="88" x2="360" y2="88" stroke="#cbd5e1" stroke-width="2"/>

  
  <rect x="110" y="150" width="640" height="280" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

  
  <rect x="110" y="150" width="640" height="14" fill="#cbd5e1"/>
  <rect x="110" y="416" width="640" height="14" fill="#cbd5e1"/>
  <text x="430" y="140" font-size="16.8" fill="#1d4ed8" text-anchor="middle">gantry travels the X-axis on V-slot rails →</text>

  
  <rect x="430" y="150" width="16" height="280" fill="#d97706" opacity="0.9"/>
  
  <rect x="414" y="270" width="48" height="40" rx="5" fill="#cbd5e1" stroke="#d97706" stroke-width="2"/>
  <text x="438" y="295" font-size="11.55" fill="#b45309" text-anchor="middle">Z</text>
  <line x1="438" y1="310" x2="438" y2="336" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>
  <text x="406" y="284" font-size="13.75" fill="#334155" text-anchor="end">tool head (Z-axis):</text>
  <text x="406" y="300" font-size="13.75" fill="#334155" text-anchor="end">seed · water · weed</text>

  
  <g text-anchor="middle">
    <circle cx="200" cy="230" r="14" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="264" font-size="14.85" fill="#0f172a">carrot</text>
    <text x="200" y="280" font-size="11.55" fill="#475569">(120, 80)</text>

    <circle cx="300" cy="360" r="14" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="394" font-size="14.85" fill="#0f172a">lettuce</text>
    <text x="300" y="410" font-size="11.55" fill="#475569">(240, 200)</text>

    <circle cx="560" cy="220" r="14" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
    <text x="560" y="254" font-size="14.85" fill="#0f172a">radish</text>
    <text x="560" y="270" font-size="11.55" fill="#475569">(360, 70)</text>

    <circle cx="670" cy="360" r="14" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
    <text x="670" y="394" font-size="14.85" fill="#0f172a">clover cover</text>
    <text x="670" y="410" font-size="11.55" fill="#475569">(480, 200)</text>
  </g>

  <text x="430" y="470" font-size="18.2" fill="#0f172a" text-anchor="middle">every plant is an X-Y coordinate; no walking paths, no wasted bed</text>
  <text x="430" y="496" font-size="16.8" fill="#475569" text-anchor="middle">tool heads: vacuum seed injector · root-dose nozzle · OpenCV rotary weeder</text>
</svg>
