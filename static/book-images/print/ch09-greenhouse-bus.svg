<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.7 20.9 812.7 523" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#2563eb"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#d97706"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE GREENHOUSE AUTOMATION BUS</text>
  <line x1="40" y1="66" x2="460" y2="66" stroke="#cbd5e1" stroke-width="2"/>

  
  <rect x="290" y="96" width="280" height="76" rx="10" fill="#f1f5f9" stroke="#d97706" stroke-width="2.5"/>
  <text x="430" y="128" font-size="21" font-weight="600" fill="#0f172a" text-anchor="middle">RASPBERRY PI HOST</text>
  <text x="430" y="152" font-size="16.25" fill="#334155" text-anchor="middle">Mycodo engine · PID loops</text>

  
  <path d="M 360 172 L 240 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="256" y="200" font-size="16.25" fill="#1d4ed8" text-anchor="end">I2C sensor bus</text>
  <path d="M 500 172 L 620 220" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
  <text x="608" y="200" font-size="16.25" fill="#b45309">GPIO relay board</text>

  
  <text x="240" y="252" font-size="16.25" font-weight="600" fill="#1d4ed8" text-anchor="middle">SENSORS (inputs)</text>
  <rect x="110" y="266" width="260" height="72" rx="10" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="296" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">SHT31-D</text>
  <text x="240" y="318" font-size="15.4" fill="#334155" text-anchor="middle">air temperature + humidity</text>

  <rect x="110" y="350" width="260" height="72" rx="10" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="380" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">STEMMA SOIL SENSOR</text>
  <text x="240" y="402" font-size="13.2" fill="#334155" text-anchor="middle">capacitive moisture + soil temp</text>

  
  <text x="620" y="252" font-size="16.25" font-weight="600" fill="#b45309" text-anchor="middle">ACTUATORS (12V outputs)</text>
  <rect x="490" y="266" width="260" height="72" rx="10" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="296" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">WATER SOLENOID VALVE</text>
  <text x="620" y="318" font-size="14.85" fill="#334155" text-anchor="middle">gravity-fed irrigation line</text>

  <rect x="490" y="350" width="260" height="72" rx="10" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="380" font-size="16.25" font-weight="600" fill="#0f172a" text-anchor="middle">EXHAUST FAN + GROW LIGHTS</text>
  <text x="620" y="402" font-size="14.3" fill="#334155" text-anchor="middle">brushless DC, relay-switched</text>

  
  <path d="M 240 422 Q 240 480 430 480 Q 620 480 620 422" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#ab)" marker-end="url(#aa)"/>
  <text x="430" y="452" font-size="16.25" fill="#475569" text-anchor="middle">sense → decide → actuate → sense</text>

  <text x="430" y="528" font-size="18.2" fill="#0f172a" text-anchor="middle">the greenhouse waters itself with control-loop precision while you sleep</text>
</svg>
