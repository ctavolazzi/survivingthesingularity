<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 20.9 802.9 446.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#475569"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">MODEL COLLAPSE, GENERATION BY GENERATION</text>
  <line x1="40" y1="66" x2="520" y2="66" stroke="#cbd5e1" stroke-width="2"/>

  
  
  <g>
    <rect x="70" y="140" width="200" height="200" rx="10" fill="#f1f5f9" stroke="#d97706" stroke-width="2.5"/>
    <path d="M 90 300 C 130 300 130 180 170 180 C 210 180 210 300 250 300" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <path d="M 90 300 C 110 300 120 250 130 230 C 145 200 155 300 170 300 C 185 300 195 210 210 235 C 220 255 230 300 250 300" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="170" y="128" font-size="18.2" font-weight="600" fill="#b45309" text-anchor="middle">GEN 0 · human data</text>
    <text x="170" y="322" font-size="12.1" fill="#334155" text-anchor="middle">high variance, rich tails</text>
  </g>

  <line x1="278" y1="240" x2="318" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="298" y="224" font-size="15.4" fill="#475569" text-anchor="middle">train</text>

  
  <g>
    <rect x="326" y="140" width="200" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 346 300 C 396 300 396 210 426 210 C 456 210 456 300 506 300" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <text x="426" y="128" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">GEN 1</text>
    <text x="426" y="322" font-size="12.65" fill="#334155" text-anchor="middle">rare cases can disappear</text>
  </g>

  <line x1="534" y1="240" x2="574" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="554" y="224" font-size="15.4" fill="#475569" text-anchor="middle">train</text>

  
  <g>
    <rect x="582" y="140" width="200" height="200" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <line x1="682" y1="300" x2="682" y2="185" stroke="#475569" stroke-width="6"/>
    <path d="M 662 300 L 682 300" stroke="#475569" stroke-width="6"/>
    <text x="682" y="128" font-size="18.2" font-weight="600" fill="#334155" text-anchor="middle">LATER GENERATIONS</text>
    <text x="682" y="322" font-size="13.2" fill="#475569" text-anchor="middle">collapse toward a spike</text>
  </g>

  <text x="430" y="380" font-size="18.2" fill="#0f172a" text-anchor="middle">repeatedly replacing training data with finite samples can lose variety</text>
  <text x="430" y="410" font-size="16.8" fill="#475569" text-anchor="middle">schematic only: no fixed timetable, and the final spike can drift</text>
  <text x="430" y="452" font-size="16.8" fill="#b45309" text-anchor="middle">source: Shumailov et al., Nature (2024); training conditions matter</text>
</svg>
