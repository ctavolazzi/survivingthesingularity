<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -0.4 460 648.2" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="THE SPLIT-LOOP THERMAL EXCHANGE">
<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>

<text x="24" y="34" font-size="22" fill="#0f172a" text-anchor="start" font-weight="600">THE SPLIT-LOOP THERMAL EXCHANGE</text>
<line x1="24" y1="46" x2="456" y2="46" stroke="#d97706" stroke-width="1.5"/>
<text x="24" y="69" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">A conceptual coolant circuit.</text>
<text x="24" y="88" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">Hot out, cool back.</text>
<text x="240" y="112" font-size="18.2" fill="#334155" text-anchor="middle" font-weight="600">INSIDE THE INSULATED SHELL</text>
<rect x="42" y="133" width="177" height="94" rx="8" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
<text x="130.5" y="159" font-size="19.6" fill="#0f172a" text-anchor="middle" font-weight="600">GPU BLOCK</text>
<text x="130.5" y="186" font-size="14.4" fill="#334155" text-anchor="middle" font-weight="400">Heat at the silicon</text>
<rect x="261" y="133" width="177" height="94" rx="8" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
<text x="349.5" y="159" font-size="19.6" fill="#0f172a" text-anchor="middle" font-weight="600">CPU BLOCK</text>
<text x="349.5" y="186" font-size="15.6" fill="#334155" text-anchor="middle" font-weight="400">600–1000 W total*</text>
<path d="M131 227 V241 H179 V259" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
<path d="M350 227 V241 H300 V259" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
<rect x="120" y="265" width="240" height="81" rx="8" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
<text x="240.0" y="291" font-size="19.6" fill="#0f172a" text-anchor="middle" font-weight="600">12V BRUSHLESS PUMP</text>
<text x="240.0" y="318" font-size="15.6" fill="#334155" text-anchor="middle" font-weight="400">PWM speed control</text>
<path d="M360 302 H455 V434 H389" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
<text x="444" y="373" font-size="14.4" fill="#b91c1c" text-anchor="end" font-weight="400">HOT OUT</text>
<line x1="42" y1="361" x2="325" y2="361" stroke="#94a3b8" stroke-dasharray="5 5"/>
<text x="240" y="390" font-size="15.6" fill="#1d4ed8" text-anchor="middle" font-weight="600">OUTSIDE THE SHELL: FREE AIR</text>
<rect x="100" y="407" width="280" height="99" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
<text x="240.0" y="433" font-size="19.6" fill="#0f172a" text-anchor="middle" font-weight="600">EXTERNAL RADIATOR</text>
<text x="240.0" y="460" font-size="14.4" fill="#334155" text-anchor="middle" font-weight="400">Salvaged Honda Civic core*</text>
<text x="240.0" y="478" font-size="14.4" fill="#334155" text-anchor="middle" font-weight="400">+ 12V high-static fans*</text>
<path d="M100 456 H20 V174 H36" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M20 174 V123 H455 V174 H444" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<text x="44" y="529" font-size="15.6" fill="#1d4ed8" text-anchor="start" font-weight="400">COOL RETURN TO THE CHIPS</text>
<text x="24" y="555" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">Move heat outside, away from living space.</text>
<text x="24" y="574" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">Heat per second = flow × Cp × ΔT</text>
<text x="24" y="593" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">In winter, recover heat for the living space.</text>
<text x="24" y="612" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">*Illustrative components and combined load.</text>
<text x="24" y="631" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">Schematic only; engineer a compatible system.</text>
</svg>
