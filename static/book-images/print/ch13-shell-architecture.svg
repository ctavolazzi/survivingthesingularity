<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">A double-wide shell</title>
<desc id="desc">Conceptual plan of two nominal forty-by-eight-foot containers. Their combined exterior footprint is 640 square feet, not usable interior area. Foundations, openings, connections and reinforcement require project-specific design.</desc>
