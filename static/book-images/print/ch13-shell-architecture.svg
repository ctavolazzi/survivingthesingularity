<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 20.9 793.3 518.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#64748b"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE DOUBLE-WIDE SHELL ARCHITECTURE</text>
  <text x="40" y="74" font-size="16.8" fill="#475569">plan view · two one-trip 40 ft high-cube containers, mated and cut open</text>
  <line x1="40" y1="88" x2="470" y2="88" stroke="#cbd5e1" stroke-width="2"/>

  
  <line x1="110" y1="128" x2="750" y2="128" stroke="#64748b" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="430" y="120" font-size="18.2" fill="#334155" text-anchor="middle">40 feet</text>

  
  <rect x="110" y="150" width="640" height="256" rx="4" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5"/>

  
  <line x1="118" y1="278" x2="742" y2="278" stroke="#d97706" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="430" y="271" font-size="15" fill="#b45309" text-anchor="middle">seam: interior mating walls cut away, steel skeleton takes the load</text>

  
  <text x="430" y="190" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">CONTAINER 1 · 8' × 40'</text>
  <text x="430" y="216" font-size="18.2" fill="#334155" text-anchor="middle">communal workspace · air-gapped server room</text>

  
  <text x="430" y="330" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">CONTAINER 2 · 8' × 40'</text>
  <text x="430" y="356" font-size="18.2" fill="#334155" text-anchor="middle">wet-room · kitchen · living quarters</text>

  
  <line x1="86" y1="150" x2="86" y2="278" stroke="#64748b" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="72" y="220" font-size="16.8" fill="#334155" text-anchor="middle" transform="rotate(-90 72 220)">8 ft</text>
  <line x1="86" y1="278" x2="86" y2="406" stroke="#64748b" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="72" y="348" font-size="16.8" fill="#334155" text-anchor="middle" transform="rotate(-90 72 348)">8 ft</text>

  
  <rect x="104" y="144" width="12" height="12" fill="#d97706"/>
  <rect x="744" y="144" width="12" height="12" fill="#d97706"/>
  <rect x="104" y="400" width="12" height="12" fill="#d97706"/>
  <rect x="744" y="400" width="12" height="12" fill="#d97706"/>
  <rect x="104" y="272" width="12" height="12" fill="#d97706"/>
  <rect x="744" y="272" width="12" height="12" fill="#d97706"/>
  <text x="430" y="446" font-size="16.8" fill="#475569" text-anchor="middle">■ corner castings: chained tight, welded with 7018 rods</text>

  <text x="430" y="500" font-size="19.6" fill="#0f172a" text-anchor="middle">640 sq ft of open span · roughly $25,000 all-in</text>
  <text x="430" y="524" font-size="16.8" fill="#475569" text-anchor="middle">I-beam and C-channel reinforcement detail: see the center-seam figure below</text>
</svg>
