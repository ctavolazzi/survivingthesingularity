<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">A wall is an assembly</title>
<desc id="desc">Conceptual wall section with steel, insulation and air control, and an interior layer. Insulation reduces conduction without eliminating it. Moisture, ventilation and required fire protection belong in the complete design.</desc>
<rect width="480" height="500" fill="#ffffff"/>
<text x="20" y="31" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">A wall is an assembly</text>
<path d="M20 46L460 46" fill="none" stroke="#9a4f13" stroke-width="2"/>
<text x="20" y="78" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Conceptual section, not a thickness schedule.</text>
<text x="20" y="113" font-size="14" fill="#17251f" text-anchor="start" font-weight="400">Example heat flow</text>
<path d="M149 147H169V277H149Z" fill="#ffffff" stroke="#17251f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M181 147H290V277H181Z" fill="#ffffff" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M187 157L187 267" fill="none" stroke="#a2afa6" stroke-width="0.8"/>
<path d="M199 157L199 267" fill="none" stroke="#a2afa6" stroke-width="0.8"/>
