<circle cx="159" cy="301" r="12" fill="#ffffff" stroke="#17251f" stroke-width="1.3"/>
<text x="159" y="306" font-size="14" fill="#17251f" text-anchor="middle" font-weight="400">1</text>
<circle cx="235" cy="301" r="12" fill="#ffffff" stroke="#17251f" stroke-width="1.3"/>
<text x="235" y="306" font-size="14" fill="#17251f" text-anchor="middle" font-weight="400">2</text>
<circle cx="314" cy="301" r="12" fill="#ffffff" stroke="#17251f" stroke-width="1.3"/>
<text x="314" y="306" font-size="14" fill="#17251f" text-anchor="middle" font-weight="400">3</text>
<text x="20" y="342" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">1  Steel skin</text>
<text x="20" y="364" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">2  Insulation + continuous air control</text>
<text x="20" y="386" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">3  Interior finish + required fire protection</text>
<path d="M20 411L460 411" fill="none" stroke="#a2afa6" stroke-width="1"/>
<text x="20" y="431" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Idealized layer: heat flow = k × A × ΔT / d</text>
<text x="20" y="452" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Design moisture control and ventilation too.</text>
<text x="20" y="473" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Heat flow depends on the whole assembly.</text>
</svg>
