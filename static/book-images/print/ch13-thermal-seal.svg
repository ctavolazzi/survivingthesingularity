<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.7 20.9 867.4 506.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#d97706"/>
    </marker>
    <pattern id="foam" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#78350f"/>
      <circle cx="11" cy="10" r="2.2" fill="#78350f"/>
    </pattern>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE THERMAL BARRIER LAYER</text>
  <text x="40" y="74" font-size="16.8" fill="#475569">wall section · why the tin can stays 70°F on 500 watts</text>
  <line x1="40" y1="88" x2="420" y2="88" stroke="#cbd5e1" stroke-width="2"/>

  
  <rect x="300" y="130" width="22" height="300" fill="#64748b"/>
  <text x="318" y="118" font-size="12" fill="#334155" text-anchor="end">steel</text>
  <text x="311" y="452" font-size="12" fill="#475569" text-anchor="middle">2 mm</text>

  
  <rect x="322" y="130" width="170" height="300" fill="#f1f5f9" stroke="none"/>
  <rect x="322" y="130" width="170" height="300" fill="url(#foam)" opacity="0.55"/>
  <rect x="322" y="130" width="170" height="300" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="407" y="118" font-size="12" fill="#b45309" text-anchor="middle">closed-cell spray foam</text>
  <text x="407" y="452" font-size="12" fill="#b45309" text-anchor="middle">75 mm · R-21</text>

  
  <rect x="492" y="130" width="26" height="300" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="498" y="118" font-size="12" fill="#334155" text-anchor="start">wood panel</text>

  
  <text x="160" y="160" font-size="18.2" fill="#475569" text-anchor="middle">EXTERIOR</text>
  <text x="160" y="180" font-size="16.8" fill="#475569" text-anchor="middle">-20°F blizzard or</text>
  <text x="160" y="198" font-size="16.8" fill="#475569" text-anchor="middle">100°F heat dome</text>
  <text x="660" y="160" font-size="18.2" fill="#0f172a" text-anchor="middle">INTERIOR</text>
  <text x="660" y="180" font-size="16.8" fill="#334155" text-anchor="middle">70°F sanctuary</text>
  <text x="660" y="198" font-size="16.8" fill="#334155" text-anchor="middle">under 500 W load</text>

  
  <line x1="120" y1="280" x2="292" y2="280" stroke="#d97706" stroke-width="8" marker-end="url(#ah)"/>
  <text x="200" y="264" font-size="19.6" font-weight="600" fill="#b45309" text-anchor="middle">HEAT</text>
  <line x1="330" y1="280" x2="400" y2="280" stroke="#d97706" stroke-width="4" opacity="0.6" marker-end="url(#ah)"/>
  <line x1="430" y1="280" x2="460" y2="280" stroke="#d97706" stroke-width="2" opacity="0.35" marker-end="url(#ah)"/>
  <text x="580" y="285" font-size="18.2" font-weight="600" fill="#1d4ed8">BLOCKED</text>

  
  <line x1="292" y1="354" x2="302" y2="330" stroke="#2563eb" stroke-width="1.5"/>
  <text x="288" y="372" font-size="15.6" fill="#1d4ed8" text-anchor="end">foam bonds to bare steel:</text>
  <text x="288" y="390" font-size="15.6" fill="#1d4ed8" text-anchor="end">vapor-sealed, no condensation,</text>
  <text x="288" y="408" font-size="15.6" fill="#1d4ed8" text-anchor="end">no rust from the inside out</text>

  <text x="430" y="486" font-size="18.2" fill="#0f172a" text-anchor="middle">Q = k·A·ΔT / d  →  drive k down with foam, and the tin can stops leaking watts</text>
  <text x="430" y="512" font-size="16.8" fill="#475569" text-anchor="middle">walls R-21 (75 mm) · ceiling R-28 (100 mm) · continuous seal, zero fiberglass batts</text>
</svg>
