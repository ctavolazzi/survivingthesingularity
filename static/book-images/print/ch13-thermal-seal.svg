<path d="M271 157L271 267" fill="none" stroke="#a2afa6" stroke-width="0.8"/>
<path d="M283 157L283 267" fill="none" stroke="#a2afa6" stroke-width="0.8"/>
<path d="M178 147L178 277" fill="none" stroke="#315f78" stroke-width="3"/>
<path d="M303 147H325V277H303Z" fill="#ffffff" stroke="#17251f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M22 212L133 212" fill="none" stroke="#9a4f13" stroke-width="1.6"/>
<path d="M133 212L125.97933950487702 215.83540430883363" fill="none" stroke="#9a4f13" stroke-width="1.6"/>
<path d="M133 212L125.97933950487702 208.16459569116637" fill="none" stroke="#9a4f13" stroke-width="1.6"/>
