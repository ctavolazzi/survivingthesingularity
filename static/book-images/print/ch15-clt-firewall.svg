<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 20.9 707.1 610.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#2563eb"/>
    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE COOPERATIVE LAND TRUST FIREWALL</text>
  <line x1="40" y1="66" x2="470" y2="66" stroke="#cbd5e1" stroke-width="2"/>

  
  <rect x="206" y="92" width="448" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="430" y="118" font-size="21" font-weight="600" fill="#334155" text-anchor="middle">SPECULATIVE REAL ESTATE MARKET</text>
  <text x="430" y="140" font-size="12.6" fill="#475569" text-anchor="middle">algorithmic buyers · foreclosure scripts · tax auctions</text>

  
  <line x1="430" y1="152" x2="430" y2="208" stroke="#475569" stroke-width="3" marker-end="url(#ag)"/>
  <text x="450" y="186" font-size="16.8" fill="#475569">attempts to buy / foreclose</text>

  
  <rect x="150" y="214" width="560" height="16" rx="8" fill="#d97706"/>
  <text x="430" y="252" font-size="17.25" font-weight="600" fill="#b45309" text-anchor="middle">BLOCKED BY LEGAL SHIELD</text>

  
  <rect x="150" y="270" width="560" height="320" rx="12" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="302" font-size="22" font-weight="600" fill="#1d4ed8" text-anchor="middle">COMMUNITY LAND TRUST (CLT)</text>

  
  <rect x="190" y="322" width="480" height="96" rx="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="350" font-size="21" font-weight="600" fill="#0f172a" text-anchor="middle">THE LAND · held in perpetuity</text>
  <text x="430" y="374" font-size="13.2" fill="#334155" text-anchor="middle">removed from market speculation forever</text>
  <text x="430" y="394" font-size="13.2" fill="#334155" text-anchor="middle">tax-sheltered via easements + agricultural classification</text>

  
  <line x1="430" y1="418" x2="430" y2="464" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="450" y="446" font-size="16.8" fill="#334155">99-year ground lease</text>

  
  <rect x="190" y="470" width="480" height="96" rx="10" fill="#cbd5e1" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="498" font-size="17.25" font-weight="600" fill="#0f172a" text-anchor="middle">THE STEWARDSHIP · housing, farms, greenhouses</text>
  <text x="430" y="522" font-size="16.8" fill="#334155" text-anchor="middle">owned by community members, inheritable</text>
  <text x="430" y="542" font-size="16.8" fill="#334155" text-anchor="middle">resale by formula: permanently affordable</text>

  <text x="430" y="616" font-size="16.8" fill="#475569" text-anchor="middle">split the title: the market can no longer reach the dirt</text>
</svg>
