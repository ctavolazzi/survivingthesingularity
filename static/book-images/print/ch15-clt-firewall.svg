<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">Land and homes, separate</title>
<desc id="desc">A typical community land trust homeownership arrangement. A household owns the home; the trust holds the land under a long renewable ground lease with resale restrictions. Taxes, debt and stewardship duties remain.</desc>
<rect width="480" height="500" fill="#ffffff"/>
<text x="20" y="31" font-size="20" fill="#17251f" text-anchor="start" font-weight="600">Land and homes, separate</text>
<path d="M20 46L460 46" fill="none" stroke="#9a4f13" stroke-width="2"/>
<text x="20" y="77" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">A common housing model; terms vary.</text>
<path d="M49 240L199 193L430 249L280 296Z" fill="#ffffff" stroke="#9a4f13" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M161 154L233 101L307 154Z" fill="#ffffff" stroke="#17251f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M175 155H294V240H175Z" fill="#ffffff" stroke="#17251f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M194 179H217V208H194Z" fill="#ffffff" stroke="#315f78" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M245 190H274V240H245Z" fill="#ffffff" stroke="#17251f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280" y="276" font-size="14" fill="#17251f" text-anchor="middle" font-weight="400">Trust’s land</text>
<path d="M337 122H427V206H337Z" fill="#ffffff" stroke="#315f78" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M349 142L413 142" fill="none" stroke="#a2afa6" stroke-width="1"/>
<path d="M349 152L413 152" fill="none" stroke="#a2afa6" stroke-width="1"/>
<path d="M349 162L413 162" fill="none" stroke="#a2afa6" stroke-width="1"/>
<path d="M349 188Q364 174 378 187T415 182" fill="none" stroke="#315f78" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="382" y="227" font-size="14" fill="#17251f" text-anchor="middle" font-weight="400">Lease</text>
<text x="20" y="336" font-size="16" fill="#17251f" text-anchor="start" font-weight="400">Household: owns the home</text>
<text x="20" y="361" font-size="16" fill="#17251f" text-anchor="start" font-weight="400">Trust: holds and stewards the land</text>
<path d="M20 392L460 392" fill="none" stroke="#a2afa6" stroke-width="1"/>
<text x="20" y="412" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Often a 99-year renewable ground lease.</text>
<text x="20" y="433" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Resale terms aim to retain affordability.</text>
<text x="20" y="454" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Taxes, debt and governance duties remain.</text>
</svg>
