<text x="20" y="530" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Charging, wires and regulation still lose energy.</text>
<text x="20" y="551" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Both need protection and voltage matching.</text>
<text x="20" y="572" font-size="14" fill="#4b5b52" text-anchor="start" font-weight="400">Conceptual energy paths, not a wiring plan.</text>
