<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 585" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">Two routes to a DC load</title>
<desc id="desc">Solar charging and storage feed two conceptual paths to an already-DC device. The inverter path converts DC to AC and an adapter converts it back. The DC route still needs voltage regulation and protection. Both have charging, wiring and operating losses; compare at the intended load.</desc>
