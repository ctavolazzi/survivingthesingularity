  <text x="145" y="308" font-size="11" fill="#334155" text-anchor="middle">scrap steel · PETG · salvage</text>

  <line x1="240" y1="280" x2="292" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>

  
  <rect x="298" y="110" width="290" height="340" rx="12" fill="#f1f5f9" stroke="#d97706" stroke-width="2.5"/>
  <text x="443" y="144" font-size="18.2" font-weight="600" fill="#b45309" text-anchor="middle">OPEN-SOURCE MACHINE CORES</text>

