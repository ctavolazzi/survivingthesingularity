  <text x="443" y="218" font-size="13.2" fill="#334155" text-anchor="middle">RepRap · prints its own parts</text>

  <rect x="318" y="252" width="250" height="76" rx="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <text x="443" y="284" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">CNC PLASMA / ROUTER</text>
  <text x="443" y="306" font-size="13.2" fill="#334155" text-anchor="middle">low-power, DC-bus friendly</text>

  <rect x="318" y="340" width="250" height="76" rx="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <text x="443" y="372" font-size="18.2" font-weight="600" fill="#0f172a" text-anchor="middle">OPEN-SOURCE TRACTOR</text>
  <text x="443" y="394" font-size="13.2" fill="#334155" text-anchor="middle">BCS-type · GVCS pattern</text>

  
  <line x1="568" y1="202" x2="620" y2="202" stroke="#d97706" stroke-width="2" marker-end="url(#aa)"/>
  <rect x="626" y="172" width="190" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
