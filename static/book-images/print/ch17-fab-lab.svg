    </marker>
  </defs>

  
  <text x="40" y="52" font-size="21" letter-spacing="4.2" fill="#334155">THE DECENTRALIZED FAB LAB</text>
  <line x1="40" y1="66" x2="380" y2="66" stroke="#cbd5e1" stroke-width="2"/>

  
