<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.2 20.9 859.6 516.9" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
