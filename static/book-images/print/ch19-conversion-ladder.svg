<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 14 844 629" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" role="img" aria-label="The Ladder">

<text x="40" y="46" font-size="22" letter-spacing="2.32" fill="#0f172a">THE LADDER</text>
<line x1="40" y1="60" x2="162" y2="60" stroke="#d97706" stroke-width="2"/>
<text x="40" y="82" font-size="14.3" fill="#334155">Nine rungs, from the bottom up. Start with food. Climb as far as your town can hold.</text>
<rect x="40" y="424" width="6" height="148" rx="3" fill="#d97706"/>
<text x="58" y="502" font-size="14.3" letter-spacing="1.3" fill="#334155">FEED PEOPLE NOW</text>
<rect x="40" y="268" width="6" height="148" rx="3" fill="#d97706"/>
<text x="58" y="346" font-size="12.65" letter-spacing="1.15" fill="#334155">CHANGE WHO OWNS AND DECIDES</text>
<rect x="40" y="112" width="6" height="148" rx="3" fill="#d97706"/>
<text x="58" y="190" font-size="14.3" letter-spacing="1.3" fill="#334155">WIDEN THE FLOOR</text>
<rect x="300" y="528" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="554" font-size="20.8" font-weight="600" fill="#0f172a">1</text>
<text x="352" y="545" font-size="14.3" font-weight="600" fill="#0f172a">Count what's wasted and who's hungry</text>
<text x="352" y="561" font-size="14.3" fill="#334155">California SB 1383 recovery targets</text>
<rect x="300" y="476" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="502" font-size="20.8" font-weight="600" fill="#0f172a">2</text>
<text x="352" y="493" font-size="14.3" font-weight="600" fill="#0f172a">Feed everyone who asks</text>
<text x="352" y="509" font-size="14.3" fill="#334155">France, 2016: no destroying edible food</text>
<rect x="300" y="424" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="450" font-size="20.8" font-weight="600" fill="#0f172a">3</text>
<text x="352" y="441" font-size="14.3" font-weight="600" fill="#0f172a">Make the meal a public service</text>
<text x="352" y="457" font-size="14.3" fill="#334155">California universal school meals, 2022</text>
<rect x="300" y="372" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="398" font-size="20.8" font-weight="600" fill="#0f172a">4</text>
<text x="352" y="389" font-size="14.3" font-weight="600" fill="#0f172a">Take the ground off the market</text>
<text x="352" y="405" font-size="14.3" fill="#334155">community land trusts, 99-year leases</text>
<rect x="300" y="320" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="346" font-size="19.2" font-weight="600" fill="#0f172a">5</text>
<text x="352" y="337" font-size="14.3" font-weight="600" fill="#0f172a">Own the machines together</text>
<text x="352" y="353" font-size="14.3" fill="#334155">rural electric co-ops, from 1936</text>
<rect x="300" y="268" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="294" font-size="20.8" font-weight="600" fill="#0f172a">6</text>
<text x="352" y="285" font-size="14.3" font-weight="600" fill="#0f172a">Stop letting a score decide who survives</text>
<text x="352" y="301" font-size="14.3" fill="#334155">NYC right to counsel, 2017</text>
<rect x="300" y="216" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="322" y="242" font-size="20.8" font-weight="600" fill="#0f172a">7</text>
<text x="352" y="233" font-size="14.3" font-weight="600" fill="#0f172a">Widen the floor</text>
<text x="352" y="249" font-size="14.3" fill="#334155">NHS, 1948; Universal Basic Services</text>
<rect x="300" y="164" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-dasharray="7 4" stroke-width="2"/>
<text x="322" y="190" font-size="20.8" font-weight="600" fill="#0f172a">8</text>
<text x="352" y="181" font-size="14.3" font-weight="600" fill="#0f172a">Put it on the scoreboard, in public</text>
<text x="352" y="197" font-size="14.3" fill="#334155">holds the ladder together</text>
<rect x="300" y="112" width="560" height="40" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-dasharray="7 4" stroke-width="2"/>
<text x="322" y="138" font-size="20.8" font-weight="600" fill="#0f172a">9</text>
<text x="352" y="129" font-size="14.3" font-weight="600" fill="#0f172a">Keep the market above the floor</text>
<text x="352" y="145" font-size="14.3" fill="#334155">money stays; it becomes optional</text>
<rect x="300" y="588" width="18" height="12" rx="3" fill="#f1f5f9" stroke="#d97706" stroke-width="2"/>
<text x="326" y="599" font-size="14.3" fill="#334155">already done somewhere</text>
<rect x="560" y="588" width="18" height="12" rx="3" fill="#f1f5f9" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 2"/>
<text x="586" y="599" font-size="14.3" fill="#334155">how you hold it together</text>
<text x="40" y="628" font-size="12.65" fill="#334155">Chapter 19. Sources for every rung in the chapter and in Appendix B.</text>
</svg>
