<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs>

<text x="24" y="34" font-size="22" fill="#0f172a" text-anchor="start" font-weight="600">WHEN THE JOBS GO, DINNER GOES</text>
<line x1="24" y1="46" x2="456" y2="46" stroke="#d97706" stroke-width="1.5"/>
<text x="24" y="69" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">Food insecurity rose sharply in the recession</text>
<text x="24" y="88" font-size="15.6" fill="#334155" text-anchor="start" font-weight="400">and took a decade to return to earlier levels.</text>
<text x="24" y="115" font-size="18.2" fill="#0f172a" text-anchor="start" font-weight="600">SHARE OF US HOUSEHOLDS</text>
<path d="M26 140 H55" fill="none" stroke="#d97706" stroke-width="2"/>
<text x="66" y="144" font-size="16.8" fill="#334155" text-anchor="start" font-weight="400">Food insecure at some time in the year</text>
