<text x="66" y="168" font-size="16.8" fill="#334155" text-anchor="start" font-weight="400">Very low food security</text>
<text x="24" y="194" font-size="16.8" fill="#334155" text-anchor="start" font-weight="400">SHADED: 2007–2009 RECESSION</text>
