<text x="448.0" y="458" font-size="16.8" fill="#334155" text-anchor="middle" font-weight="400">2024</text>
<text x="24" y="491" font-size="16.8" fill="#0f172a" text-anchor="start" font-weight="400">2007: 11.1% food insecure</text>
