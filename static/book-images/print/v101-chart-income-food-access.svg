<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 504" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="income-food-access-title income-food-access-desc">
<title id="income-food-access-title">INCOME AND FOOD ACCESS</title>
<desc id="income-food-access-desc">Share of US households food insecure · 2024. Selected groups omit middle incomes and unknown income. National rate covers all households, not just the two shown. Survey association does not establish causation; food insecurity is not identical to reduced intake for every member.</desc>
<defs><pattern id="hatch-income-food-access" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#1d4ed8" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="504" fill="#ffffff"/>
<text x="24" y="34" font-size="19" fill="#0f172a" text-anchor="start" font-weight="600">INCOME AND FOOD ACCESS</text>
<line x1="24" y1="48" x2="456" y2="48" stroke="#b45309" stroke-width="1.5"/>
<text x="24" y="73" font-size="13.5" fill="#334155" text-anchor="start" font-weight="400">Share of US households food insecure · 2024</text>
<line x1="25" y1="105" x2="51" y2="105" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
<text x="64" y="110" font-size="13.5" fill="#334155" text-anchor="start" font-weight="400">National rate: 13.7%</text>
<text x="24" y="160" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="400">Below the poverty threshold</text>
<line x1="50" y1="200" x2="444" y2="200" stroke="#cbd5e1" stroke-width="1"/>
<line x1="50" y1="200" x2="394.969" y2="200" stroke="#b45309" stroke-width="3"/>
<line x1="169.951" y1="187" x2="169.951" y2="213" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="394.969" cy="200" r="6" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="394.969" y="230" font-size="13.5" fill="#b45309" text-anchor="middle" font-weight="600">39.4%</text>
<text x="24" y="278" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="400">At least 185% of the threshold</text>
<line x1="50" y1="318" x2="444" y2="318" stroke="#cbd5e1" stroke-width="1"/>
<line x1="50" y1="318" x2="119.169" y2="318" stroke="#b45309" stroke-width="3"/>
<line x1="169.951" y1="305" x2="169.951" y2="331" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="119.169" cy="318" r="6" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="119.169" y="348" font-size="13.5" fill="#b45309" text-anchor="middle" font-weight="600">7.9%</text>
<line x1="50" y1="368" x2="50" y2="374" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="397" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">0%</text>
<line x1="137.556" y1="368" x2="137.556" y2="374" stroke="#cbd5e1" stroke-width="1"/>
<text x="137.556" y="397" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">10%</text>
<line x1="225.111" y1="368" x2="225.111" y2="374" stroke="#cbd5e1" stroke-width="1"/>
<text x="225.111" y="397" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">20%</text>
<line x1="312.667" y1="368" x2="312.667" y2="374" stroke="#cbd5e1" stroke-width="1"/>
<text x="312.667" y="397" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">30%</text>
<line x1="400.222" y1="368" x2="400.222" y2="374" stroke="#cbd5e1" stroke-width="1"/>
<text x="400.222" y="397" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">40%</text>
<line x1="24" y1="420" x2="456" y2="420" stroke="#cbd5e1" stroke-width="1"/>
<text x="24" y="443" font-size="13.5" fill="#334155" text-anchor="start" font-weight="400">Selected income groups; survey estimates.</text>
<text x="24" y="464" font-size="13.5" fill="#334155" text-anchor="start" font-weight="400">Association does not establish causation.</text>
<text x="24" y="485" font-size="13.5" fill="#334155" text-anchor="start" font-weight="400">Source: USDA ERS, ERR-358, Table 2.</text>
