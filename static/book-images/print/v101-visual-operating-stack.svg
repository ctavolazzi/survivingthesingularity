<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 397" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">THE FILE IS ONE LAYER</title>
<desc id="desc">Model weights shown as a loose paper beside an exploded operating stack. A usable local system also requires software, compute, power and people who can maintain it.</desc>
