<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 357" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">WHAT A CONTINUING SERVICE COSTS</title>
<desc id="desc">An open ledger names four costs behind a continuing service: equipment, maintenance, remaining labor and delivery. All four require dependable funding, even when the person eating pays nothing.</desc>
