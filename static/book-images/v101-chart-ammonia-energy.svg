<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 592" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="ammonia-energy-title ammonia-energy-desc">
<title id="ammonia-energy-title">THE ENERGY IN AMMONIA</title>
<desc id="ammonia-energy-desc">Gigajoules per tonne, net basis. 2021 report values, not a current census of plants. Benchmarks are not proof every existing plant can reach them, or that biological fixation has no energy cost.</desc>
<defs><pattern id="hatch-ammonia-energy" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#3b82f6" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="592" fill="#020617"/>
<text x="24" y="34" font-size="19" fill="#f1f5f9" text-anchor="start" font-weight="600">THE ENERGY IN AMMONIA</text>
