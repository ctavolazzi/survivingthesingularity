<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 562" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="data-centre-demand-title data-centre-demand-desc">
<title id="data-centre-demand-title">THE MACHINE’S APPETITE</title>
<desc id="data-centre-demand-desc">Worldwide data-centre electricity demand. All data centres worldwide, not AI-only electricity. The 2030 figure is a projection, not an observation.</desc>
<defs><pattern id="hatch-data-centre-demand" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#3b82f6" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="562" fill="#020617"/>
<text x="24" y="34" font-size="19" fill="#f1f5f9" text-anchor="start" font-weight="600">THE MACHINE’S APPETITE</text>
<line x1="24" y1="48" x2="456" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
<text x="24" y="73" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Worldwide data-centre electricity demand</text>
<text x="24" y="110" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="400">Terawatt-hours per year</text>
<line x1="85" y1="403" x2="448" y2="403" stroke="#334155" stroke-width="1"/>
<text x="73" y="408" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">0</text>
<line x1="85" y1="339" x2="448" y2="339" stroke="#334155" stroke-width="1"/>
<text x="73" y="344" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">250</text>
<line x1="85" y1="275" x2="448" y2="275" stroke="#334155" stroke-width="1"/>
<text x="73" y="280" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">500</text>
<line x1="85" y1="211" x2="448" y2="211" stroke="#334155" stroke-width="1"/>
<text x="73" y="216" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">750</text>
<line x1="85" y1="147" x2="318" y2="147" stroke="#334155" stroke-width="1"/>
<line x1="386" y1="147" x2="448" y2="147" stroke="#334155" stroke-width="1"/>
<text x="73" y="152" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">1000</text>
<rect x="120" y="278.84" width="100" height="124.16" fill="#f59e0b"/>
<text x="170" y="263.84" font-size="23" fill="#f59e0b" text-anchor="middle" font-weight="600">485</text>
<text x="170" y="433" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="600">2025</text>
<text x="170" y="458" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">Estimate</text>
<rect x="302" y="159.8" width="100" height="243.2" fill="url(#hatch-data-centre-demand)" stroke="#3b82f6" stroke-width="2"/>
<text x="352" y="144.8" font-size="23" fill="#3b82f6" text-anchor="middle" font-weight="600">950</text>
<text x="352" y="433" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="600">2030</text>
<text x="352" y="458" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">Projection</text>
<line x1="24" y1="483" x2="456" y2="483" stroke="#334155" stroke-width="1"/>
<text x="24" y="506" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">All data centres, not AI alone.</text>
<text x="24" y="527" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">2030 is a forecast, not a meter reading.</text>
<text x="24" y="548" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Source: IEA, Key Questions on Energy and AI, 2026.</text>
</svg>
