<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 554" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="forecast-shift-title forecast-shift-desc">
<title id="forecast-shift-title">FORECASTS MOVED CLOSER</title>
<desc id="forecast-shift-desc">Two surveys; aggregate 50% forecast dates. These are aggregate probabilistic forecasts from respondents, not actual arrival dates, guarantees, or observed technology progress. High-level machine intelligence and full labor automation are different milestones.</desc>
<defs><pattern id="hatch-forecast-shift" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#3b82f6" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="554" fill="#020617"/>
<text x="24" y="34" font-size="19" fill="#f1f5f9" text-anchor="start" font-weight="600">FORECASTS MOVED CLOSER</text>
<line x1="24" y1="48" x2="456" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
<text x="24" y="73" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Two surveys; aggregate 50% forecast dates</text>
<circle cx="32" cy="104" r="6" fill="#020617" stroke="#94a3b8" stroke-width="2"/>
<text x="48" y="109" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">2022 survey</text>
<circle cx="263" cy="104" r="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
<text x="279" y="109" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">2023 survey</text>
<text x="24" y="154" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="600">High-level machine intelligence</text>
<text x="24" y="177" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">13 years earlier</text>
<line x1="72" y1="211" x2="440" y2="211" stroke="#334155" stroke-width="1"/>
<line x1="134.1" y1="211" x2="164" y2="211" stroke="#f59e0b" stroke-width="3"/>
