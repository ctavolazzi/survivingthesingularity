<text x="256" y="445" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">2100</text>
<line x1="348" y1="415" x2="348" y2="422" stroke="#334155" stroke-width="1"/>
<text x="348" y="445" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">2140</text>
<line x1="440" y1="415" x2="440" y2="422" stroke="#334155" stroke-width="1"/>
