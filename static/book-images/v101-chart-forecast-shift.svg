<text x="24" y="490" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Respondent forecasts, not arrival dates.</text>
<text x="24" y="511" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">The two milestones measure different things.</text>
<text x="24" y="532" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Source: Grace et al., arXiv:2401.02843.</text>
</svg>
