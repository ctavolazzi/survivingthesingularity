<circle cx="134.1" cy="211" r="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
<text x="134.1" y="198" font-size="13.5" fill="#f59e0b" text-anchor="middle" font-weight="600">2047</text>
<text x="164" y="239" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">2060</text>
<text x="24" y="299" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="600">Full automation of labor</text>
<text x="24" y="322" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">48 years earlier</text>
<line x1="72" y1="356" x2="440" y2="356" stroke="#334155" stroke-width="1"/>
<line x1="292.8" y1="356" x2="403.2" y2="356" stroke="#f59e0b" stroke-width="3"/>
<circle cx="403.2" cy="356" r="6" fill="#020617" stroke="#94a3b8" stroke-width="2"/>
<circle cx="292.8" cy="356" r="6" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
<text x="292.8" y="343" font-size="13.5" fill="#f59e0b" text-anchor="middle" font-weight="600">2116</text>
<text x="403.2" y="384" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">2164</text>
<line x1="72" y1="415" x2="72" y2="422" stroke="#334155" stroke-width="1"/>
<text x="72" y="445" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="400">2020</text>
