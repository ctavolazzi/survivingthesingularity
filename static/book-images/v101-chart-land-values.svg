<title id="land-values-title">WHAT AN ACRE COSTS</title>
<desc id="land-values-desc">Average US farm real estate value. Includes farm land and buildings; not vacant land alone. Nominal, not inflation-adjusted; national averages are not local asking prices.</desc>
