<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 676" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="meal-response-title meal-response-desc">
<title id="meal-response-title">WHEN A MEAL FAILS</title>
<desc id="meal-response-desc">Illustrative premortem worksheet. Illustrative worksheet, not results from an actual service or a measured risk model. Personal details belong in appropriate private records, not the public board.</desc>
<defs><pattern id="hatch-meal-response" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#3b82f6" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="676" fill="#020617"/>
<text x="24" y="34" font-size="19" fill="#f1f5f9" text-anchor="start" font-weight="600">WHEN A MEAL FAILS</text>
<line x1="24" y1="48" x2="456" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
<text x="24" y="73" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Illustrative premortem worksheet</text>
<line x1="39" y1="142" x2="39" y2="190" stroke="#334155" stroke-width="2"/>
<circle cx="39" cy="125" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="130" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">1</text>
<text x="72" y="130" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHO LOSES THE MEAL?</text>
<text x="72" y="155" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Name affected people and jobs.</text>
<line x1="39" y1="224" x2="39" y2="272" stroke="#334155" stroke-width="2"/>
<circle cx="39" cy="207" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="212" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">2</text>
<text x="72" y="212" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHAT WARNS YOU?</text>
<text x="72" y="237" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Define a signal or missing check-in.</text>
<line x1="39" y1="306" x2="39" y2="354" stroke="#334155" stroke-width="2"/>
<circle cx="39" cy="289" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="294" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">3</text>
<text x="72" y="294" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHO RESPONDS?</text>
<text x="72" y="319" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Confirm a lead and an available backup.</text>
<line x1="39" y1="388" x2="39" y2="436" stroke="#334155" stroke-width="2"/>
<circle cx="39" cy="371" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="376" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">4</text>
<text x="72" y="376" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHAT GETS DELIVERED?</text>
<text x="72" y="401" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Test the alternative; show any gap.</text>
<line x1="39" y1="470" x2="39" y2="518" stroke="#334155" stroke-width="2"/>
<circle cx="39" cy="453" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="458" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">5</text>
<text x="72" y="458" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHAT KEEPS IT RUNNING?</text>
<text x="72" y="483" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Name supplies, labor, money, end date.</text>
<circle cx="39" cy="535" r="16" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
<text x="39" y="540" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">6</text>
<text x="72" y="540" font-size="14.5" fill="#f1f5f9" text-anchor="start" font-weight="600">WHEN DO YOU CHECK AGAIN?</text>
<text x="72" y="565" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Set a review date and needed evidence.</text>
<line x1="24" y1="599" x2="456" y2="599" stroke="#334155" stroke-width="1"/>
<text x="24" y="622" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Test the handoff before making the promise.</text>
<text x="24" y="643" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Keep personal details out of the public board.</text>
<text x="24" y="664" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Source: Chapter 18, failed-meal record.</text>
</svg>
