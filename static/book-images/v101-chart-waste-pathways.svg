<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 674" font-family="'JetBrains Mono',monospace" role="img" aria-labelledby="waste-pathways-title waste-pathways-desc">
<title id="waste-pathways-title">WHERE WASTED FOOD GOES</title>
<desc id="waste-pathways-desc">US retail, food service, households · 2019. Food retail, food service, and residential sectors only; manufacturing is excluded. Wasted food includes inedible parts, not a quantity that could all be donated. Donation excludes food banks&#x27; undistributed portion, which is assigned to other pathways. Published integer rows sum to one ton above the published total; retained as transcribed. Percentages sum to 100.00.</desc>
<defs><pattern id="hatch-waste-pathways" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#3b82f6" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="480" height="674" fill="#020617"/>
<text x="24" y="34" font-size="19" fill="#f1f5f9" text-anchor="start" font-weight="600">WHERE WASTED FOOD GOES</text>
<line x1="24" y1="48" x2="456" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
<text x="24" y="73" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">US retail, food service, households · 2019</text>
<text x="24" y="110" font-size="24" fill="#f1f5f9" text-anchor="start" font-weight="600">66.2 million tons</text>
<text x="24" y="148" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="400">Landfill</text>
<text x="456" y="148" font-size="13.5" fill="#f59e0b" text-anchor="end" font-weight="600">59.84%</text>
<rect x="24" y="157" width="432" height="10" fill="#334155"/>
<rect x="24" y="157" width="430.848" height="10" fill="#f59e0b"/>
