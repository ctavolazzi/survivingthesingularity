<line x1="456" y1="551" x2="456" y2="558" stroke="#334155" stroke-width="1"/>
<text x="456" y="580" font-size="13.5" fill="#94a3b8" text-anchor="end" font-weight="400">60%</text>
<line x1="24" y1="590" x2="456" y2="590" stroke="#334155" stroke-width="1"/>
<text x="24" y="613" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">EPA estimates; 2019 Wasted Food Report,</text>
<text x="24" y="634" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Table 5. Includes inedible parts.</text>
<text x="24" y="655" font-size="13.5" fill="#94a3b8" text-anchor="start" font-weight="400">Donation is net of food banks’ unusable share.</text>
