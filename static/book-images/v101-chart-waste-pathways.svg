<text x="456" y="194" font-size="13.5" fill="#3b82f6" text-anchor="end" font-weight="600">14.57%</text>
<rect x="24" y="203" width="432" height="10" fill="#334155"/>
<rect x="24" y="203" width="104.904" height="10" fill="#3b82f6"/>
<text x="24" y="240" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="400">Donation to people</text>
<text x="456" y="240" font-size="13.5" fill="#3b82f6" text-anchor="end" font-weight="600">7.76%</text>
<rect x="24" y="249" width="432" height="10" fill="#334155"/>
<rect x="24" y="249" width="55.872" height="10" fill="#3b82f6"/>
<text x="24" y="286" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="400">Sewer / wastewater</text>
<text x="456" y="286" font-size="13.5" fill="#3b82f6" text-anchor="end" font-weight="600">6.00%</text>
<rect x="24" y="295" width="432" height="10" fill="#334155"/>
<rect x="24" y="295" width="43.2" height="10" fill="#3b82f6"/>
<text x="24" y="332" font-size="13.5" fill="#f1f5f9" text-anchor="start" font-weight="400">Composting</text>
<text x="456" y="332" font-size="13.5" fill="#3b82f6" text-anchor="end" font-weight="600">4.99%</text>
<rect x="24" y="341" width="432" height="10" fill="#334155"/>
<rect x="24" y="341" width="35.928" height="10" fill="#3b82f6"/>
