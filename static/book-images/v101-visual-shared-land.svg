<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 399" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, monospace">
<title id="title">LAND HAS PEOPLE ON IT</title>
<desc id="desc">Cultivated land rests above an open agreement with distinct spaces for an owner, users and neighbors. Shared use requires consent, terms and a way to challenge decisions.</desc>
